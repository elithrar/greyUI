name: Development source artifact

on:
  push:
    branches: [feature/high-value-components]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: tar --exclude=.git -czf /tmp/greyui-dev.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: greyui-dev
          path: /tmp/greyui-dev.tgz
          retention-days: 1
