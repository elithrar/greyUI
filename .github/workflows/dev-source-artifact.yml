name: Development browser artifact

on:
  push:
    branches: [feature/high-value-components]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes playwright@1.57.0 install chromium
      - run: tar -C "$HOME/.cache" -czf /tmp/ms-playwright.tgz ms-playwright
      - uses: actions/upload-artifact@v4
        with:
          name: ms-playwright
          path: /tmp/ms-playwright.tgz
          retention-days: 1
