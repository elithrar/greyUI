name: Diagnose greyUI 0.4.3 visual review

on:
  push:
    branches:
      - fix/number-field-imports-0.4.3
    paths:
      - .github/workflows/diagnose-0.4.3.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/number-field-imports-0.4.3
      - name: Decode and print review script
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          source = Path('.github/workflows/review-0.4.3.yml').read_text()
          payloads = re.findall(r'payload = "([A-Za-z0-9+/=]+)"', source)
          if len(payloads) != 2:
              raise RuntimeError(f'Expected two embedded payloads, found {len(payloads)}')
          Path('/tmp/visual-review.mjs').write_bytes(gzip.decompress(base64.b64decode(payloads[1])))
          PY
          nl -ba /tmp/visual-review.mjs | sed -n '1,120p'
