name: Prepare 0.4.7 lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-0.4.7-lock.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Update lockfile version only
        run: |
          npm version 0.4.7 --no-git-tag-version
          git checkout HEAD -- package.json
      - name: Commit lockfile and remove helper
        run: |
          rm .github/workflows/prepare-0.4.7-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/prepare-0.4.7-lock.yml
          git diff --cached --check
          git commit -m "Prepare lockfile for 0.4.7"
          git push origin HEAD:main
