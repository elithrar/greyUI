name: Visual review high-value components

on:
  push:
    branches: [feature/high-value-components]
    paths:
      - ".github/workflows/visual-review-high-value-components.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/high-value-components
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
      - run: npm run build:docs
      - run: npm run verify:docs

      - name: Install browser review dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start docs
        run: |
          npm run dev:docs -- --host 127.0.0.1 --port 4173 > /tmp/greyui-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/greyui-vite.log
          exit 1

      - name: Review responsive rendering and interactions
        run: |
          mkdir -p artifacts/visual-review
          cat > /tmp/visual-review.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { writeFile } from "node:fs/promises";
          import { chromium } from "playwright";

          const browser = await chromium.launch();
          const viewports = [1280, 768, 390, 320];
          const report = [];

          function withinViewport(box, viewport) {
            return (
              box !== null &&
              box.x >= -1 &&
              box.y >= -1 &&
              box.x + box.width <= viewport.width + 1 &&
              box.y + box.height <= viewport.height + 1
            );
          }

          for (const width of viewports) {
            const context = await browser.newContext({
              viewport: { width, height: 900 },
              deviceScaleFactor: 1,
              reducedMotion: "reduce",
            });
            const page = await context.newPage();
            await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });

            const overflow = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            assert.ok(
              overflow.scrollWidth <= overflow.clientWidth + 1,
              `Horizontal overflow at ${width}px: ${overflow.scrollWidth} > ${overflow.clientWidth}`,
            );

            const highValue = page.locator("#high-value");
            await highValue.scrollIntoViewIfNeeded();
            await highValue.screenshot({
              path: `artifacts/visual-review/high-value-${width}.png`,
            });

            const toggleDemo = highValue
              .locator(".docs-high-value-demo")
              .filter({ has: page.getByRole("heading", { name: "ToggleGroup" }) });
            const grid = toggleDemo.getByRole("button", { name: "Grid" });
            const snap = toggleDemo.getByRole("button", { name: "Snap" });
            const locked = toggleDemo.getByRole("button", { name: "Locked" });
            assert.equal(await grid.getAttribute("aria-pressed"), "true");
            await snap.click();
            assert.equal(await snap.getAttribute("aria-pressed"), "true");
            assert.equal(await locked.isDisabled(), true);
            await grid.focus();
            await page.keyboard.press("ArrowRight");
            assert.equal(await page.evaluate(() => document.activeElement?.textContent?.trim()), "Snap");

            const toggleMetrics = await page.evaluate(() => {
              const grouped = document.querySelector(".greyui-toggle-group-item");
              const button = document.querySelector(
                ".greyui-button:not(.greyui-toggle-group-item):not(.greyui-window-widget)",
              );
              if (!(grouped instanceof HTMLElement) || !(button instanceof HTMLElement)) return null;
              const groupedStyle = getComputedStyle(grouped);
              const buttonStyle = getComputedStyle(button);
              return {
                groupedHeight: grouped.getBoundingClientRect().height,
                buttonHeight: button.getBoundingClientRect().height,
                selectedShadow: groupedStyle.boxShadow,
                focusOutline: groupedStyle.outlineStyle,
                borderWidth: groupedStyle.borderTopWidth,
                buttonBorderWidth: buttonStyle.borderTopWidth,
              };
            });
            assert.ok(toggleMetrics !== null);
            assert.ok(Math.abs(toggleMetrics.groupedHeight - toggleMetrics.buttonHeight) <= 2);
            assert.equal(toggleMetrics.borderWidth, toggleMetrics.buttonBorderWidth);
            assert.match(toggleMetrics.selectedShadow, /inset/i);
            assert.notEqual(toggleMetrics.focusOutline, "none");

            const autocompleteDemo = highValue
              .locator(".docs-high-value-demo")
              .filter({ has: page.getByRole("heading", { name: "Autocomplete" }) });
            const input = autocompleteDemo.getByRole("combobox", { name: "Operating system" });
            await input.fill("Hai");
            const option = page.getByRole("option", { name: "Haiku" });
            await option.waitFor({ state: "visible" });
            const popup = page.locator(".greyui-autocomplete-popup");
            const popupBox = await popup.boundingBox();
            assert.ok(withinViewport(popupBox, page.viewportSize()));
            await page.screenshot({
              path: `artifacts/visual-review/autocomplete-open-${width}.png`,
              fullPage: false,
            });
            await input.fill("Custom OS");
            await input.press("Tab");
            assert.equal(await input.inputValue(), "Custom OS");

            const inputMetrics = await page.evaluate(() => {
              const autocomplete = document.querySelector(".greyui-autocomplete-input-group");
              const combobox = document.querySelector(
                '[data-greyui-component="combobox"]:not(.greyui-autocomplete-input-group)',
              );
              if (!(autocomplete instanceof HTMLElement) || !(combobox instanceof HTMLElement)) {
                return null;
              }
              return {
                autocompleteHeight: autocomplete.getBoundingClientRect().height,
                comboboxHeight: combobox.getBoundingClientRect().height,
                autocompleteBorder: getComputedStyle(autocomplete).borderTopWidth,
                comboboxBorder: getComputedStyle(combobox).borderTopWidth,
              };
            });
            assert.ok(inputMetrics !== null);
            assert.ok(Math.abs(inputMetrics.autocompleteHeight - inputMetrics.comboboxHeight) <= 1);
            assert.equal(inputMetrics.autocompleteBorder, inputMetrics.comboboxBorder);

            const accordionDemo = highValue
              .locator(".docs-high-value-demo")
              .filter({ has: page.getByRole("heading", { name: "Accordion" }) });
            const advanced = accordionDemo.getByRole("button", { name: "Advanced" });
            await advanced.click();
            assert.equal(await advanced.getAttribute("aria-expanded"), "true");
            await accordionDemo.getByText("Cache, indexing, and integration settings.").waitFor();
            assert.equal(await accordionDemo.getByRole("button", { name: "Managed" }).isDisabled(), true);

            const disclosureMetrics = await page.evaluate(() => {
              const accordion = document.querySelector(".greyui-accordion-trigger");
              const collapsible = document.querySelector(".greyui-collapsible-trigger");
              if (!(accordion instanceof HTMLElement) || !(collapsible instanceof HTMLElement)) {
                return null;
              }
              return {
                accordionHeight: accordion.getBoundingClientRect().height,
                collapsibleHeight: collapsible.getBoundingClientRect().height,
                accordionBorder: getComputedStyle(accordion).borderTopWidth,
                collapsibleBorder: getComputedStyle(collapsible).borderTopWidth,
              };
            });
            assert.ok(disclosureMetrics !== null);
            assert.ok(
              Math.abs(disclosureMetrics.accordionHeight - disclosureMetrics.collapsibleHeight) <= 2,
            );
            assert.equal(disclosureMetrics.accordionBorder, disclosureMetrics.collapsibleBorder);

            const checkboxDemo = highValue
              .locator(".docs-high-value-demo")
              .filter({ has: page.getByRole("heading", { name: "CheckboxGroup" }) });
            const sourceMap = checkboxDemo.getByRole("checkbox", { name: "Source map" });
            await sourceMap.click();
            assert.equal(await sourceMap.getAttribute("aria-checked"), "true");

            const fieldsetDemo = highValue
              .locator(".docs-high-value-demo")
              .filter({ has: page.getByRole("heading", { name: "Fieldset" }) });
            assert.equal(
              await fieldsetDemo.getByRole("checkbox", { name: "Enforce policy" }).isDisabled(),
              true,
            );
            const fieldsetMetrics = await fieldsetDemo.locator(".greyui-fieldset").first().evaluate((node) => {
              const style = getComputedStyle(node);
              return {
                borderStyle: style.borderTopStyle,
                borderWidth: style.borderTopWidth,
                background: style.backgroundColor,
              };
            });
            assert.equal(fieldsetMetrics.borderStyle, "solid");
            assert.equal(fieldsetMetrics.borderWidth, "1px");
            assert.notEqual(fieldsetMetrics.background, "rgba(0, 0, 0, 0)");

            const importSection = page.locator("#imports");
            await importSection.scrollIntoViewIfNeeded();
            const importOverflow = await importSection.evaluate((node) => ({
              clientWidth: node.clientWidth,
              scrollWidth: node.scrollWidth,
            }));
            assert.ok(importOverflow.scrollWidth <= importOverflow.clientWidth + 1);
            assert.ok((await importSection.getByRole("button", { name: /^Copy .* import$/ }).count()) > 40);

            report.push({ width, overflow, popupBox, toggleMetrics, inputMetrics, disclosureMetrics });
            await context.close();
          }

          await browser.close();
          await writeFile(
            "artifacts/visual-review/report.json",
            JSON.stringify(report, null, 2) + "\n",
          );
          EOF
          node /tmp/visual-review.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: high-value-component-visual-review
          path: artifacts/visual-review
          retention-days: 7

      - name: Remove temporary review workflow
        run: |
          rm -f .github/workflows/visual-review-high-value-components.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete visual review for grouped controls"
          git push origin HEAD:feature/high-value-components
