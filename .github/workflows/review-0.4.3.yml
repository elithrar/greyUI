name: Review greyUI 0.4.3

on:
  push:
    branches:
      - fix/number-field-imports-0.4.3
    paths:
      - .github/workflows/review-0.4.3.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/number-field-imports-0.4.3
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply 0.4.3 changes
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path("/tmp/apply_0_4_3.py").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python3 /tmp/apply_0_4_3.py

      - run: npm version 0.4.3 --no-git-tag-version --allow-same-version
      - run: npm run format
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
      - run: npm run verify:docs

      - name: Install browser review dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start docs
        run: |
          npm run dev:docs -- --host 127.0.0.1 --port 4173 > /tmp/greyui-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/greyui-vite.log
          exit 1

      - name: Run visual and interaction review
        run: |
          mkdir -p artifacts/visual-review-0.4.3
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path("/tmp/visual-review.mjs").write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          node /tmp/visual-review.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: greyui-0.4.3-visual-review
          path: artifacts/visual-review-0.4.3
          retention-days: 7

      - name: Commit reviewed changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs tests package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix number field arrows and colocate component imports"
          git push origin HEAD:fix/number-field-imports-0.4.3
