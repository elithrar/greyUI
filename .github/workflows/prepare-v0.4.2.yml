name: Prepare v0.4.2 metadata

on:
  push:
    branches: [release/v0.4.2]
    paths:
      - ".github/workflows/prepare-v0.4.2.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.4.2
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm version 0.4.2 --no-git-tag-version
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check

      - name: Commit version metadata
        run: |
          rm -f .github/workflows/prepare-v0.4.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/prepare-v0.4.2.yml
          git commit -m "Bump greyUI to v0.4.2"
          git push origin HEAD:release/v0.4.2
