name: Clean up greyUI 0.4.3 docs CSS

on:
  push:
    branches:
      - fix/number-field-imports-0.4.3
    paths:
      - .github/workflows/cleanup-0.4.3-css.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/number-field-imports-0.4.3
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Remove unnecessary important declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/src/docs.css')
          source = path.read_text()
          old = '''.docs-stylesheet-note {
            margin: 7px 0 0 !important;
            color: var(--greyui-text-muted);
            font-size: 11px !important;
          }'''
          new = '''.docs-hero .docs-stylesheet-note {
            margin: 7px 0 0;
            color: var(--greyui-text-muted);
            font-size: 11px;
          }'''
          if old not in source:
              raise RuntimeError('Expected stylesheet-note rule was not found')
          path.write_text(source.replace(old, new))
          PY

      - run: npm run format
      - run: npm run check

      - name: Commit cleanup
        run: |
          rm -f .github/workflows/cleanup-0.4.3-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean up docs import styling"
          git push origin HEAD:fix/number-field-imports-0.4.3
