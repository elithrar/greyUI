name: Trim documentation guidance v2

on:
  push:
    branches:
      - quality/anti-slop
    paths:
      - .github/workflows/trim-docs.yml

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/anti-slop
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/review/trim-docs.py
      - run: npm run format
      - run: npm run check
      - run: npm run verify:docs
      - name: Commit concise docs and remove review scaffolding
        run: |
          rm -rf .github/review
          rm -f .github/workflows/trim-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Trim technical documentation guidance"
          git push origin HEAD:quality/anti-slop
