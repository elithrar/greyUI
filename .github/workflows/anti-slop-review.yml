name: Anti-slop code quality review

on:
  push:
    branches:
      - quality/anti-slop
    paths:
      - .github/workflows/anti-slop-review.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/anti-slop
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/review/apply-anti-slop-fixes.py
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm run verify:docs

      - name: Commit validated fixes
        run: |
          rm -rf .github/review
          rm -f .github/workflows/anti-slop-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply anti-slop code quality fixes"
          git push origin HEAD:quality/anti-slop
