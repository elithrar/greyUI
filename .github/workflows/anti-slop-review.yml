name: Anti-slop code quality review

on:
  push:
    branches:
      - quality/anti-slop
    paths:
      - .github/workflows/anti-slop-review.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/anti-slop
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/review/fix-layer-inference.py
      - run: python3 .github/review/apply-anti-slop-fixes.py
      - run: python3 .github/review/fix-autocomplete-overload.py

      - name: Trim vendored anti-slop to the generic production plugin
        run: |
          find tools/oxlint/anti-slop -name '*.test.ts' -delete
          rm -rf tools/oxlint/anti-slop/effect
          cat > tools/oxlint/anti-slop/UPSTREAM.md <<'EOF'
          # anti-slop upstream

          Vendored from https://github.com/dmmulroy/anti-slop at commit `6d538555cb151d4121ed51a27db81890eacf8ae9`.

          Only the generic production Oxlint plugin is vendored. Upstream test harness files and the optional Effect-specific plugin are intentionally omitted because greyUI does not execute them.

          The vendored source is intentionally owned by this repository after import, per anti-slop's installation guidance.
          EOF

      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm run verify:docs

      - name: Commit validated fixes
        run: |
          rm -rf .github/review
          rm -f .github/workflows/anti-slop-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply anti-slop code quality fixes"
          git push origin HEAD:quality/anti-slop
