name: Recover high-value component implementation

on:
  push:
    branches: [feature/high-value-components]
    paths:
      - ".github/workflows/recover-high-value-components.yml"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/high-value-components
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update stale docs anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/apply_high_value_components.py")
          source = path.read_text()
          source = source.replace(
              "main = insert_once(main, '          <Section\\n            id=\"buttons\"'",
              "main = insert_once(main, '            <Section\\n              id=\"buttons\"'",
          )
          source = source.replace(
              "main = insert_once(main, '          <Section\\n            id=\"desktop\"'",
              "main = insert_once(main, '            <Section\\n              id=\"desktop\"'",
          )
          path.write_text(source)
          PY

      - run: python3 scripts/apply_high_value_components.py

      - name: Fix generated contracts and interactions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          test_path = Path("tests/component-imports.test.tsx")
          test_source = test_path.read_text()
          test_source = test_source.replace(
              'import { fileURLToPath } from "node:url";',
              'import { resolve } from "node:path";',
          )
          test_source = test_source.replace(
              'fileURLToPath(new URL("../src/components", import.meta.url))',
              'resolve(process.cwd(), "src/components")',
          )
          test_source = test_source.replace(
              "const writeText = vi.fn().mockResolvedValue(undefined);",
              "const writeText = vi.fn<(text: string) => Promise<void>>().mockResolvedValue(undefined);",
          )
          test_path.write_text(test_source)

          docs_path = Path("docs/src/high-value-components.tsx")
          replacement = (
              "        {imports === undefined ? (\n"
              "          <ComponentImport name={name} path={path} />\n"
              "        ) : (\n"
              "          <ComponentImport name={name} path={path} imports={imports} />\n"
              "        )}"
          )
          docs_source = docs_path.read_text().replace(
              "        <ComponentImport name={name} path={path} imports={imports} />",
              replacement,
          )
          docs_path.write_text(docs_source)

          context_path = Path("src/fieldset-context.ts")
          context_path.write_text(
              "\n".join(
                  [
                      'import { createContext, useContext } from "react";',
                      "",
                      "export const FieldsetDisabledContext = createContext(false);",
                      "",
                      "export function useFieldsetDisabled() {",
                      "  return useContext(FieldsetDisabledContext);",
                      "}",
                      "",
                  ]
              )
          )

          fieldset_path = Path("src/components/fieldset.tsx")
          fieldset_source = fieldset_path.read_text()
          fieldset_source = fieldset_source.replace(
              'import { Fieldset as FieldsetPrimitive } from "@base-ui/react/fieldset";',
              'import { Fieldset as FieldsetPrimitive } from "@base-ui/react/fieldset";\nimport { FieldsetDisabledContext, useFieldsetDisabled } from "../fieldset-context";',
          )
          fieldset_root = "\n".join(
              [
                  "export function FieldsetRoot({",
                  '  className = "",',
                  "  disabled = false,",
                  "  children,",
                  "  ...props",
                  "}: WithClassName<ComponentProps<typeof FieldsetPrimitive.Root>>) {",
                  "  const parentDisabled = useFieldsetDisabled();",
                  "  const resolvedDisabled = parentDisabled || disabled;",
                  "",
                  "  return (",
                  "    <FieldsetDisabledContext.Provider value={resolvedDisabled}>",
                  "      <FieldsetPrimitive.Root",
                  '        data-greyui-component="fieldset"',
                  "        disabled={resolvedDisabled}",
                  '        className={`greyui-fieldset ${className}`.trim()}',
                  "        {...props}",
                  "      >",
                  "        {children}",
                  "      </FieldsetPrimitive.Root>",
                  "    </FieldsetDisabledContext.Provider>",
                  "  );",
                  "}",
              ]
          )
          fieldset_source, count = re.subn(
              r"export function FieldsetRoot\(\{.*?\n\}\n\n(?=export function FieldsetLegend)",
              fieldset_root + "\n\n",
              fieldset_source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("Could not replace generated Fieldset root")
          fieldset_path.write_text(fieldset_source)

          checkbox_path = Path("src/components/checkbox.tsx")
          checkbox_source = checkbox_path.read_text()
          checkbox_source = checkbox_source.replace(
              'import { Checkbox as CheckboxPrimitive } from "@base-ui/react/checkbox";',
              'import { Checkbox as CheckboxPrimitive } from "@base-ui/react/checkbox";\nimport { useFieldsetDisabled } from "../fieldset-context";',
          )
          checkbox_source = checkbox_source.replace(
              "}: CheckboxProps) {\n  const control = (",
              "}: CheckboxProps) {\n  const fieldsetDisabled = useFieldsetDisabled();\n  const resolvedDisabled = fieldsetDisabled || disabled === true;\n\n  const control = (",
          )
          checkbox_source = checkbox_source.replace("      disabled={disabled}\n", "      disabled={resolvedDisabled}\n")
          checkbox_source = checkbox_source.replace(
              'data-disabled={disabled ? "" : undefined}',
              'data-disabled={resolvedDisabled ? "" : undefined}',
          )
          checkbox_path.write_text(checkbox_source)

          autocomplete_path = Path("src/components/autocomplete.tsx")
          autocomplete_source = autocomplete_path.read_text().replace(
              "export const AutocompleteRoot = AutocompletePrimitive.Root;",
              "\n".join(
                  [
                      "export function AutocompleteRoot<ItemValue>({",
                      "  openOnInputClick = true,",
                      "  ...props",
                      "}: AutocompletePrimitive.Root.Props<ItemValue>) {",
                      "  return (",
                      "    <AutocompletePrimitive.Root",
                      "      openOnInputClick={openOnInputClick}",
                      "      {...props}",
                      "    />",
                      "  );",
                      "}",
                  ]
              ),
          )
          autocomplete_path.write_text(autocomplete_source)

          interaction_path = Path("tests/high-value-components.test.tsx")
          interaction_source = interaction_path.read_text().replace(
              "    fireEvent.focus(input);\n    fireEvent.change(input, { target: { value: \"Hai\" } });",
              "    fireEvent.click(input);\n    fireEvent.change(input, { target: { value: \"Hai\" } });",
          )
          interaction_source = interaction_source.replace(
              '    expect(\n      checkbox.hasAttribute("disabled") ||\n        checkbox.hasAttribute("data-disabled") ||\n        checkbox.getAttribute("aria-disabled") === "true",\n    ).toBe(true);',
              '    expect(checkbox.hasAttribute("data-disabled")).toBe(true);\n    fireEvent.click(checkbox);\n    expect(checkbox.getAttribute("aria-checked")).toBe("false");',
          )
          interaction_path.write_text(interaction_source)
          PY

      - run: npm run format
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
      - run: npm run build:docs
      - run: npm run verify:docs

      - name: Commit recovered implementation
        run: |
          rm -f .github/workflows/dev-source-artifact.yml
          rm -f .github/workflows/implement-high-value-components.yml
          rm -f .github/workflows/visual-review-high-value-components.yml
          rm -f .github/workflows/finalize-high-value-components.yml
          rm -f .github/workflows/recover-high-value-components.yml
          rm -f scripts/apply_high_value_components.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add grouped controls and granular import docs"
          git push origin HEAD:feature/high-value-components
