name: Add GitHub docs link

on:
  push:
    branches:
      - docs/github-link-0.4.6
    paths:
      - .github/workflows/github-link-0.4.6.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/github-link-0.4.6
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/review/add-github-link.py
      - run: npm run format
      - run: npm run check
      - run: npm run verify:docs
      - name: Commit docs link and remove scaffolding
        run: |
          rm -rf .github/review
          rm -f .github/workflows/github-link-0.4.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Link docs to GitHub"
          git push origin HEAD:docs/github-link-0.4.6
