name: Final documentation quality review v3

on:
  push:
    branches:
      - quality/anti-slop
    paths:
      - .github/workflows/final-docs-quality-review-v3.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/anti-slop
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/review/final-docs-quality.py
      - run: python3 .github/review/fix-docs-exact-optional.py
      - run: python3 .github/review/add-accessibility-guidance.py
      - run: npm run format
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
      - run: npm run verify:docs

      - name: Install browser review dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start docs
        run: |
          npm run dev:docs -- --host 127.0.0.1 --port 4173 > /tmp/greyui-docs.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/greyui-docs.log
          exit 1

      - name: Review technical documentation in browser
        run: |
          mkdir -p artifacts/final-docs-review
          cat > review-docs.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { chromium } from "playwright";

          const browser = await chromium.launch();
          const widths = [1280, 768, 390, 320];
          const expectedGuidance = [
            "API conventions",
            "Button behavior",
            "Choose the field",
            "Composition choices",
            "Choose feedback",
            "Overlay contract",
            "Theme overrides",
          ];

          for (const width of widths) {
            const context = await browser.newContext({
              viewport: { width, height: 1000 },
              reducedMotion: "reduce",
              permissions: ["clipboard-read", "clipboard-write"],
            });
            const page = await context.newPage();
            await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });

            const pageSize = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            assert.ok(pageSize.scrollWidth <= pageSize.clientWidth + 1, `overflow at ${width}px`);

            const navTargets = await page.locator(".docs-deskbar nav a").evaluateAll((links) =>
              links.map((link) => link.getAttribute("href")),
            );
            for (const target of navTargets) {
              assert.ok(target?.startsWith("#"));
              assert.equal(await page.locator(target).count(), 1, `missing nav target ${target}`);
            }

            for (const title of expectedGuidance) {
              assert.equal(
                await page.locator(`.docs-guidance[aria-label="${title}"]`).count(),
                1,
                `missing ${title}`,
              );
            }

            const principles = page.locator("#principles");
            assert.equal(await principles.locator(".greyui-groupbox").count(), 2);
            const principlesText = (await principles.textContent()) ?? "";
            assert.ok(principlesText.includes("accessible names"));
            assert.ok(principlesText.includes("controlled and uncontrolled conventions"));
            const baseUiLink = principles.getByRole("link", { name: "Base UI component reference" });
            assert.equal(await baseUiLink.getAttribute("href"), "https://base-ui.com/react/components");

            const importButton = principles.getByRole("button", {
              name: "Copy component import example",
            });
            await importButton.click();
            assert.equal(
              await page.evaluate(() => navigator.clipboard.readText()),
              'import { Button, GroupBox, Select, Window } from "greyui";',
            );

            const fieldsGuide = page.locator('#fields .docs-guidance[aria-label="Choose the field"]');
            for (const term of ["Select", "Combobox", "Autocomplete", "NumberField"]) {
              assert.ok((await fieldsGuide.textContent())?.includes(term));
            }

            const patterns = page.locator("#patterns");
            const groupBoxGuide = patterns.locator(".docs-groupbox-guide");
            assert.equal(await groupBoxGuide.count(), 1);
            assert.ok((await groupBoxGuide.textContent())?.includes("Fieldset"));
            assert.ok(!(await groupBoxGuide.textContent())?.includes("greyui/styles.css"));

            const overlays = page.locator('#overlays .docs-guidance[aria-label="Overlay contract"]');
            assert.ok((await overlays.textContent())?.includes("Layer.Provider"));
            assert.ok((await overlays.textContent())?.includes("Context menus are enhancements"));

            const feedback = page.locator('#feedback .docs-guidance[aria-label="Choose feedback"]');
            assert.ok((await feedback.textContent())?.includes("Progress"));
            assert.ok((await feedback.textContent())?.includes("Meter"));
            assert.ok((await feedback.textContent())?.includes("Toast.Provider"));

            assert.equal(await page.getByText("Base UI 1.7", { exact: true }).count(), 0);
            assert.equal(await page.getByText("React 19", { exact: true }).count(), 0);

            const codeDetails = page.locator(".docs-code-details");
            assert.ok((await codeDetails.count()) >= 6);
            for (let index = 0; index < (await codeDetails.count()); index += 1) {
              assert.equal(await codeDetails.nth(index).getAttribute("open"), null);
            }

            const overlayDetails = overlays.locator(".docs-code-details");
            await overlayDetails.locator("summary").click();
            assert.notEqual(await overlayDetails.getAttribute("open"), null);
            assert.ok((await overlayDetails.locator("code").textContent())?.includes("<Layer.Provider>"));

            const openPageSize = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            assert.ok(openPageSize.scrollWidth <= openPageSize.clientWidth + 1, `open code overflow at ${width}px`);

            await principles.screenshot({ path: `artifacts/final-docs-review/principles-${width}.png` });
            await page.locator("#fields").screenshot({ path: `artifacts/final-docs-review/fields-${width}.png` });
            await page.locator("#overlays").screenshot({ path: `artifacts/final-docs-review/overlays-${width}.png` });

            await context.close();
          }

          await browser.close();
          EOF
          node review-docs.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: greyui-final-docs-review
          path: artifacts/final-docs-review
          retention-days: 14

      - name: Commit reviewed changes and remove review scaffolding
        run: |
          rm -rf artifacts/final-docs-review
          rm -f review-docs.mjs
          rm -rf .github/review
          rm -f .github/workflows/final-docs-quality-review.yml
          rm -f .github/workflows/final-docs-quality-review-v2.yml
          rm -f .github/workflows/final-docs-quality-review-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tighten technical documentation"
          git push origin HEAD:quality/anti-slop
