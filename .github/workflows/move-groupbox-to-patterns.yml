name: Move GroupBox docs

on:
  push:
    branches:
      - docs/move-groupbox-to-patterns
    paths:
      - .github/workflows/move-groupbox-to-patterns.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/move-groupbox-to-patterns
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/review/move-groupbox-to-patterns.py
      - run: npm run format
      - run: npm run check
      - run: npm run build:docs

      - name: Commit the focused docs change
        run: |
          rm -rf .github/review
          rm -f .github/workflows/move-groupbox-to-patterns.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move GroupBox documentation to Application patterns"
          git push origin HEAD:docs/move-groupbox-to-patterns
