name: Recover high-value components v2

on:
  push:
    branches: [feature/high-value-components]
    paths:
      - ".github/workflows/recover-high-value-components-v2.yml"
      - "scripts/recover_high_value_components.py"

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/high-value-components
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 scripts/recover_high_value_components.py
      - run: npm run format
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
      - run: npm run build:docs
      - run: npm run verify:docs

      - name: Commit recovered implementation
        run: |
          rm -f .github/workflows/dev-source-artifact.yml
          rm -f .github/workflows/implement-high-value-components.yml
          rm -f .github/workflows/visual-review-high-value-components.yml
          rm -f .github/workflows/finalize-high-value-components.yml
          rm -f .github/workflows/recover-high-value-components.yml
          rm -f .github/workflows/recover-high-value-components-v2.yml
          rm -f scripts/apply_high_value_components.py
          rm -f scripts/recover_high_value_components.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add grouped controls and granular import docs"
          git push origin HEAD:feature/high-value-components
