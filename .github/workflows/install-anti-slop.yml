name: Install anti-slop

on:
  push:
    branches:
      - quality/anti-slop
    paths:
      - .github/workflows/install-anti-slop.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: quality/anti-slop
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Vendor anti-slop
        run: |
          rm -rf /tmp/anti-slop tools/oxlint/anti-slop
          git clone --depth 1 https://github.com/dmmulroy/anti-slop.git /tmp/anti-slop
          upstream_sha="$(git -C /tmp/anti-slop rev-parse HEAD)"
          mkdir -p tools/oxlint/anti-slop
          cp -R /tmp/anti-slop/src/. tools/oxlint/anti-slop/
          cp /tmp/anti-slop/LICENSE tools/oxlint/anti-slop/LICENSE
          cat > tools/oxlint/anti-slop/UPSTREAM.md <<EOF
          # anti-slop upstream

          Vendored from https://github.com/dmmulroy/anti-slop at commit \`${upstream_sha}\`.

          The vendored source is intentionally owned by this repository after import, per anti-slop's installation guidance.
          EOF

      - name: Install matching Oxlint plugin API
        run: |
          oxlint_version="$(node -p 'require("./node_modules/oxlint/package.json").version')"
          npm install --save-dev "@oxlint/plugins@${oxlint_version}"

      - name: Configure Oxlint
        run: |
          rm .oxlintrc.json
          cat > oxlint.config.ts <<'EOF'
          import { defineConfig } from "oxlint";

          export default defineConfig({
            plugins: ["eslint", "typescript", "react", "jsx-a11y", "import", "oxc", "vitest", "node"],
            categories: {
              correctness: "error",
              suspicious: "warn",
              perf: "warn",
            },
            jsPlugins: [
              { name: "anti-slop", specifier: "./tools/oxlint/anti-slop/index.ts" },
            ],
            rules: {
              "react/react-in-jsx-scope": "off",
              "import/no-unassigned-import": "off",
              "jsx-a11y/prefer-tag-over-role": "off",
              "anti-slop/no-chained-type-assertions": "error",
              "anti-slop/no-conditional-empty-object-spread": "error",
              "anti-slop/no-known-value-widening": "error",
              "anti-slop/no-module-mocking": "error",
              "anti-slop/no-object-parameters": "error",
              "anti-slop/no-reflect-apply": "error",
              "anti-slop/no-reflect-get": "error",
              "anti-slop/no-runtime-typeof": ["error", { allowInTypeGuards: true }],
              "anti-slop/no-shape-in-symbol-names": "error",
              "anti-slop/no-unknown-parameters": "error",
              "anti-slop/no-unknown-returns": "error",
              "anti-slop/no-unknown-type-aliases": "error",
              "anti-slop/no-unsafe-dictionary-type": "error",
              "anti-slop/no-widen-then-assert": "error",
              "anti-slop/require-safety-comment-for-type-assertion": "error",
            },
            settings: {
              "jsx-a11y": {
                components: {
                  Input: "input",
                  Textarea: "textarea",
                },
              },
            },
            env: {
              browser: true,
              node: true,
              es6: true,
            },
            ignorePatterns: [
              "dist/**",
              "docs/dist/**",
              ".wrangler/**",
              "tools/oxlint/anti-slop/**",
            ],
          });
          EOF
          node - <<'EOF'
          const fs = require("node:fs");
          const path = ".oxfmtrc.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.ignorePatterns = [...new Set([...config.ignorePatterns, "tools/oxlint/anti-slop/**"] )];
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          EOF
          npm run format

      - name: Capture anti-slop findings
        run: |
          set +e
          npm run lint 2>&1 | tee anti-slop-findings.txt
          status=${PIPESTATUS[0]}
          echo "lint_exit_code=${status}" >> "$GITHUB_ENV"
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: anti-slop-initial-findings
          path: anti-slop-findings.txt
          retention-days: 14

      - name: Commit integration baseline
        run: |
          rm anti-slop-findings.txt
          rm .github/workflows/install-anti-slop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Vendor anti-slop Oxlint rules"
          git push origin HEAD:quality/anti-slop
