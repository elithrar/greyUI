name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Upload generated lockfile for deterministic CI follow-up
        uses: actions/upload-artifact@v7
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Format with oxfmt
        run: npm run format
      - name: Upload canonical Oxfmt workspace
        uses: actions/upload-artifact@v7
        with:
          name: oxfmt-workspace
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .editorconfig
            .oxfmtrc.json
            .oxlintrc.json
            .github
            docs
            src
            tests
            package.json
            tsconfig.json
            tsconfig.build.json
            vite.config.ts
            vite-env.d.ts
      - name: Require committed oxfmt output
        run: |
          git diff --check
          if ! git diff --exit-code; then
            git diff
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: npm run verify:docs
