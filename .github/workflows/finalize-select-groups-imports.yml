name: Finalize Select, groups, and imports

on:
  push:
    branches:
      - fix/select-group-surfaces-import-banner
    paths:
      - .github/workflows/finalize-select-groups-imports.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/select-group-surfaces-import-banner
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/review/finalize-select-groups-imports.py
      - run: npm run format
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
      - run: npm run verify:docs

      - name: Install browser review dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start docs
        run: |
          npm run dev:docs -- --host 127.0.0.1 --port 4173 > /tmp/greyui-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/greyui-vite.log
          exit 1

      - name: Run visual and interaction review
        run: |
          mkdir -p artifacts/select-groups-imports
          cat > visual-review.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { writeFile } from "node:fs/promises";
          import { chromium } from "playwright";

          const browser = await chromium.launch();
          const widths = [1280, 768, 390, 320];
          const expectedSelectLabels = ["BeOS R5", "Haiku", "Inactive"];
          const report = [];

          for (const width of widths) {
            const context = await browser.newContext({
              viewport: { width, height: 1000 },
              deviceScaleFactor: 1,
              reducedMotion: "reduce",
              permissions: ["clipboard-read", "clipboard-write"],
            });
            const page = await context.newPage();
            await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });

            const pageSize = await page.evaluate(() => ({
              clientWidth: document.documentElement.clientWidth,
              scrollWidth: document.documentElement.scrollWidth,
            }));
            assert.ok(
              pageSize.scrollWidth <= pageSize.clientWidth + 1,
              `Horizontal page overflow at ${width}px`,
            );

            assert.equal(await page.locator(".docs-section-import").count(), 0);
            const banners = page.locator(".docs-component-import");
            const bannerCount = await banners.count();
            assert.ok(bannerCount >= 30, `Expected contextual imports, found ${bannerCount}`);

            const bannerMetrics = await banners.evaluateAll((nodes) =>
              nodes.map((node) => {
                const box = node.getBoundingClientRect();
                const command = node.querySelector(".docs-copy-command");
                const text = node.querySelector(".docs-copy-command-text");
                const statements = (text?.textContent ?? "").split("\n").filter(Boolean);
                return {
                  label: node.getAttribute("aria-label"),
                  height: box.height,
                  left: box.left,
                  right: box.right,
                  statements,
                  bannerBackground: getComputedStyle(node).backgroundColor,
                  commandBackground: command ? getComputedStyle(command).backgroundColor : null,
                  fontSize: text ? Number.parseFloat(getComputedStyle(text).fontSize) : 0,
                  whiteSpace: text ? getComputedStyle(text).whiteSpace : null,
                };
              }),
            );

            for (const metric of bannerMetrics) {
              assert.ok(metric.left >= -1);
              assert.ok(metric.right <= width + 1);
              assert.ok(metric.height <= 82, `${metric.label} import banner is too tall`);
              assert.ok(metric.fontSize >= 11, `${metric.label} import text is too small`);
              assert.equal(metric.whiteSpace, "pre");
              assert.ok(metric.statements.length >= 1);
              for (const statement of metric.statements) {
                assert.ok(statement.includes('from "greyui/components/'));
                assert.ok(!statement.includes('from "greyui";'));
              }
              const endpoints = metric.statements.map(
                (statement) => statement.match(/greyui\/components\/([^\"]+)/)?.[1],
              );
              assert.equal(new Set(endpoints).size, endpoints.length);
            }

            const highValue = page.locator("#high-value");
            assert.equal(await highValue.locator(":scope > .docs-component-import").count(), 0);
            assert.equal(await highValue.locator(".docs-high-value-demo").count(), 5);
            assert.equal(await highValue.locator(".docs-high-value-demo > .docs-component-import").count(), 5);

            const fieldBanner = page.locator("#fields > .docs-component-import");
            assert.equal(await fieldBanner.count(), 1);
            const fieldImportText =
              (await fieldBanner.locator(".docs-copy-command-text").textContent()) ?? "";
            assert.equal(
              fieldImportText,
              'import { Input, Textarea } from "greyui/components/input";\n' +
                'import { Select } from "greyui/components/select";',
            );
            await fieldBanner.getByRole("button", { name: "Copy Basic fields import" }).click();
            await page.waitForFunction(() =>
              document
                .querySelector("#fields > .docs-component-import .docs-copy-command")
                ?.getAttribute("data-copied") === "true",
            );
            assert.equal(await page.evaluate(() => navigator.clipboard.readText()), fieldImportText);

            const selectDemo = page
              .locator("#fields .docs-demo")
              .filter({ has: page.getByText("Select", { exact: true }) });
            const trigger = selectDemo.getByRole("combobox", { name: "Theme" });
            await trigger.click();
            const popup = page.locator(".greyui-select-popup");
            await popup.waitFor({ state: "visible" });
            const selectMetrics = await popup.evaluate((node) => {
              const popupBox = node.getBoundingClientRect();
              return {
                popup: { left: popupBox.left, right: popupBox.right, width: popupBox.width },
                items: Array.from(node.querySelectorAll(".greyui-select-item")).map((item) => {
                  const text = item.querySelector(".greyui-select-item-text");
                  if (!(item instanceof HTMLElement) || !(text instanceof HTMLElement)) return null;
                  const itemBox = item.getBoundingClientRect();
                  const textStyle = getComputedStyle(text);
                  return {
                    label: text.textContent?.trim() ?? "",
                    gridColumnStart: textStyle.gridColumnStart,
                    whiteSpace: textStyle.whiteSpace,
                    itemHeight: itemBox.height,
                    clientWidth: text.clientWidth,
                    scrollWidth: text.scrollWidth,
                    clientHeight: text.clientHeight,
                    scrollHeight: text.scrollHeight,
                  };
                }),
              };
            });
            assert.deepEqual(
              selectMetrics.items.map((item) => item?.label),
              expectedSelectLabels,
            );
            for (const item of selectMetrics.items) {
              assert.ok(item);
              assert.equal(item.gridColumnStart, "2");
              assert.equal(item.whiteSpace, "nowrap");
              assert.ok(item.scrollHeight <= item.clientHeight + 1, `${item.label} wrapped`);
              assert.ok(item.scrollWidth <= item.clientWidth + 1, `${item.label} was clipped`);
              assert.ok(item.itemHeight <= 30, `${item.label} row is too tall`);
            }
            const triggerBox = await trigger.boundingBox();
            assert.ok(triggerBox);
            assert.ok(selectMetrics.popup.width >= triggerBox.width - 1);
            assert.ok(selectMetrics.popup.left >= -1);
            assert.ok(selectMetrics.popup.right <= width + 1);

            await page.keyboard.press("ArrowDown");
            await page.keyboard.press("Enter");
            assert.equal((await trigger.textContent())?.trim(), "Haiku");

            const surfaceMetrics = await page.evaluate(() => {
              const root = getComputedStyle(document.documentElement);
              const panel = root.getPropertyValue("--greyui-panel").trim();
              const probe = document.createElement("span");
              probe.style.background = panel;
              document.body.append(probe);
              const panelColor = getComputedStyle(probe).backgroundColor;
              probe.remove();
              const backgrounds = (selector) =>
                Array.from(document.querySelectorAll(selector), (element) =>
                  getComputedStyle(element).backgroundColor,
                );
              return {
                panelColor,
                fieldsets: backgrounds(".greyui-fieldset"),
                accordionPanels: backgrounds(".greyui-accordion-panel"),
                collapsiblePanels: backgrounds(".greyui-collapsible-panel"),
                groupedCanvases: backgrounds(".docs-high-value-demo-canvas"),
              };
            });
            for (const [name, values] of Object.entries(surfaceMetrics)) {
              if (name === "panelColor") continue;
              assert.ok(values.length > 0, `No ${name} surfaces found`);
              for (const value of values) {
                assert.equal(value, surfaceMetrics.panelColor, `${name} is not using panel grey`);
              }
            }

            await page.locator("#fields").screenshot({
              path: `artifacts/select-groups-imports/fields-${width}.png`,
            });
            await page.locator("#high-value").screenshot({
              path: `artifacts/select-groups-imports/grouped-${width}.png`,
            });

            report.push({ width, pageSize, bannerMetrics, selectMetrics, surfaceMetrics });
            await context.close();
          }

          await browser.close();
          await writeFile(
            "artifacts/select-groups-imports/report.json",
            `${JSON.stringify(report, null, 2)}\n`,
          );
          EOF
          node visual-review.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: greyui-select-groups-imports-final
          path: artifacts/select-groups-imports
          retention-days: 14

      - name: Commit reviewed changes and remove review scaffolding
        run: |
          rm -rf artifacts/select-groups-imports
          rm -f visual-review.mjs
          rm -rf .github/review
          rm -f .github/workflows/diagnose-select-popup.yml
          rm -f .github/workflows/review-select-popup.yml
          rm -f .github/workflows/finalize-select-groups-imports.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Select rows and contextualize component imports"
          git push origin HEAD:fix/select-group-surfaces-import-banner
