name: Release 0.4.5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-0.4.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump version
        run: npm version 0.4.5 --no-git-tag-version
      - name: Validate release
        run: |
          npm run check
          npm run build
          npm run pack:check
          npm run verify:docs
      - name: Commit and tag
        run: |
          rm .github/workflows/release-0.4.5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/release-0.4.5.yml
          git commit -m "Bump version to 0.4.5"
          git push origin HEAD:main
          git tag v0.4.5
          git push origin v0.4.5
