name: Clean up high-value review branches

on:
  push:
    branches: [feature/high-value-components]
    paths:
      - ".github/workflows/cleanup-high-value-review-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/high-value-components
          fetch-depth: 0

      - name: Remove temporary branches
        run: |
          git push origin --delete feature/high-value-components-impl || true
          git push origin --delete feature/high-value-components-run || true

      - name: Remove this workflow
        run: |
          rm -f .github/workflows/cleanup-high-value-review-branches.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary review branches"
          git push origin HEAD:feature/high-value-components
