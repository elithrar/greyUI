name: Prepare 0.5.0 release

on:
  push:
    branches:
      - release/0.5.0
    paths:
      - .github/workflows/prepare-0.5.0.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/0.5.0
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump package version
        run: npm version 0.5.0 --no-git-tag-version
      - name: Promote changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("CHANGELOG.md")
          source = path.read_text()
          marker = "## Unreleased\n\n"
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one Unreleased changelog header")
          source = source.replace(marker, "## Unreleased\n\n## 0.5.0 — 2026-09-01\n\n", 1)
          path.write_text(source)
          PY
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
      - run: npm run verify:docs
      - name: Commit release metadata and remove helper
        run: |
          rm .github/workflows/prepare-0.5.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md .github/workflows/prepare-0.5.0.yml
          git diff --cached --check
          git commit -m "Release 0.5.0"
          git push origin HEAD:release/0.5.0
