name: Add window primitive demos

on:
  push:
    branches:
      - docs/window-primitives
    paths:
      - .github/workflows/add-window-primitive-demos.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/window-primitives
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 .github/review/add-window-primitive-demos.py
      - run: npm run format
      - run: npm run check
      - run: npm run verify:docs
      - name: Commit docs and remove scaffolding
        run: |
          rm -rf .github/review
          rm -f .github/workflows/add-window-primitive-demos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Document window chrome primitives"
          git push origin HEAD:docs/window-primitives
