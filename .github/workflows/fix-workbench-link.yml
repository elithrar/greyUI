name: Link WorkbenchOS in docs

on:
  push:
    branches:
      - fix/number-field-imports-0.4.3
    paths:
      - .github/workflows/fix-workbench-link.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/number-field-imports-0.4.3
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Link WorkbenchOS reference
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/src/main.tsx')
          source = path.read_text()
          old = '              intro="Kumo-inspired APIs adapted to WorkbenchOS: compact feedback, Tracker paths, empty states, busy indicators, and page controls without modern card styling."'
          new = '''              intro={
                <>
                  Kumo-inspired APIs adapted to <a href={WORKBENCH_URL}>WorkbenchOS</a>: compact
                  feedback, Tracker paths, empty states, busy indicators, and page controls without
                  modern card styling.
                </>
              }'''
          if old not in source:
              raise RuntimeError('Expected unlinked WorkbenchOS reference was not found')
          path.write_text(source.replace(old, new))
          PY

      - run: npm run format
      - run: npm run check

      - name: Commit the docs fix
        run: |
          rm -f .github/workflows/fix-workbench-link.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Link WorkbenchOS in component docs"
          git push origin HEAD:fix/number-field-imports-0.4.3
