name: Diagnose Select popup sizing

on:
  push:
    branches:
      - fix/select-group-surfaces-import-banner
    paths:
      - .github/workflows/diagnose-select-popup.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/select-group-surfaces-import-banner

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: python3 .github/review/fix-select-popup.py
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Start docs
        run: |
          npm run dev:docs -- --host 127.0.0.1 --port 4173 > /tmp/greyui-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/greyui-vite.log
          exit 1

      - name: Print Select layout metrics
        run: |
          cat > diagnose-select.mjs <<'EOF'
          import { chromium } from "playwright";

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await page.goto("http://127.0.0.1:4173", { waitUntil: "networkidle" });
          const demo = page
            .locator("#fields .docs-demo")
            .filter({ has: page.getByText("Select", { exact: true }) });
          await demo.getByRole("combobox", { name: "Theme" }).click();
          const popup = page.locator(".greyui-select-popup");
          await popup.waitFor({ state: "visible" });
          const result = await popup.evaluate((node) => {
            const metric = (element) => {
              if (!(element instanceof HTMLElement)) return null;
              const box = element.getBoundingClientRect();
              const style = getComputedStyle(element);
              return {
                tag: element.tagName,
                className: element.className,
                text: element.textContent?.trim(),
                width: box.width,
                height: box.height,
                clientWidth: element.clientWidth,
                scrollWidth: element.scrollWidth,
                display: style.display,
                widthStyle: style.width,
                minWidth: style.minWidth,
                maxWidth: style.maxWidth,
                gridTemplateColumns: style.gridTemplateColumns,
                flex: style.flex,
                overflow: style.overflow,
                textOverflow: style.textOverflow,
                whiteSpace: style.whiteSpace,
              };
            };
            const list = node.querySelector(".greyui-select-list");
            const items = Array.from(node.querySelectorAll(".greyui-select-item"));
            return {
              popup: metric(node),
              list: metric(list),
              items: items.map((item) => ({
                outerHTML: item.outerHTML,
                item: metric(item),
                children: Array.from(item.children).map(metric),
                text: metric(item.querySelector(".greyui-select-item-text")),
                indicator: metric(item.querySelector(".greyui-select-item-indicator")),
              })),
            };
          });
          console.log(JSON.stringify(result, null, 2));
          await page.locator("#fields").screenshot({ path: "select-diagnostic.png" });
          await browser.close();
          EOF
          node diagnose-select.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: select-popup-diagnostic
          path: select-diagnostic.png
          retention-days: 7
